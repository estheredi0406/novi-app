# Render Blueprint (D58): the same server as railway.json, for Render.
# Render reads this file when you create a "Blueprint" from the repository,
# and creates the database and the web service together.
databases:
  - name: novi-db
    databaseName: novi
    user: novi
    plan: free

services:
  - type: web
    name: novi-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Filled in by Render from the database above.
      - key: DATABASE_URL
        fromDatabase:
          name: novi-db
          property: connectionString
      # New random secrets generated by Render, never the laptop's.
      - key: JWT_SECRET
        generateValue: true
      - key: NIU_HASH_KEY
        generateValue: true
      # Asked for when the Blueprint is created: paste a new Ed25519 key
      # (command in apps/api/src/lib/recordSigning.ts).
      - key: ACEV_PRIVATE_KEY
        sync: false
      - key: MOCK_PAYMENTS_CONFIRM_MS
        value: "4000"
