# Render Blueprint (D58, D60): Novi's server and database on Render.
# Render reads this file when you create a "Blueprint" from the repository,
# and creates the database and the web service together.
databases:
  - name: novi-db
    databaseName: novi
    user: novi
    # Frankfurt is Render's closest region to Lome. It cannot be changed
    # later, and the database and the server must share it.
    region: frankfurt
    # The smallest paid database (about 6 USD a month): it does not expire
    # like the free one. 5 GB of storage (0.30 USD per GB) is plenty for
    # the pilot; it can grow later but never shrink.
    plan: 0.1c-256mb
    diskSizeGB: 5

services:
  - type: web
    name: novi-api
    runtime: docker
    region: frankfurt
    # The smallest paid instance (about 7 USD a month): it never sleeps,
    # so the payout and reminder jobs keep running (D60).
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Filled in by Render from the database above.
      - key: DATABASE_URL
        fromDatabase:
          name: novi-db
          property: connectionString
      # New random secrets generated by Render, never the laptop's.
      - key: JWT_SECRET
        generateValue: true
      - key: NIU_HASH_KEY
        generateValue: true
      # Asked for when the Blueprint is created: paste a new Ed25519 key
      # (command in apps/api/src/lib/recordSigning.ts).
      - key: ACEV_PRIVATE_KEY
        sync: false
      - key: MOCK_PAYMENTS_CONFIRM_MS
        value: "4000"
      # D71: group meetings on Daily. Set in Render's dashboard, never here.
      - key: DAILY_API_KEY
        sync: false
      # D73: the secret in the USSD gateway's address. Set in Render's dashboard.
      - key: USSD_CALLBACK_TOKEN
        sync: false
      # Pilot mode (D61): one-time codes are shown in the app while SMS is
      # a mock. Remove this once a real SMS provider is connected.
      - key: PILOT_SHOW_CODES
        value: "true"
      # D66: FUCEC's officer validates each group in the console before its
      # account opens.
      - key: MFI_GROUP_APPROVAL
        value: "true"
