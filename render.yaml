# Render Blueprint (D58, D60): Novi's server and database on Render.
# Render reads this file when you create a "Blueprint" from the repository,
# and creates the database and the web service together.
databases:
  - name: novi-db
    databaseName: novi
    user: novi
    # The smallest paid database: it does not expire like the free one.
    plan: basic-256mb

services:
  - type: web
    name: novi-api
    runtime: docker
    # The smallest paid instance: it never sleeps, so the payout and
    # reminder jobs keep running (D60).
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Filled in by Render from the database above.
      - key: DATABASE_URL
        fromDatabase:
          name: novi-db
          property: connectionString
      # New random secrets generated by Render, never the laptop's.
      - key: JWT_SECRET
        generateValue: true
      - key: NIU_HASH_KEY
        generateValue: true
      # Asked for when the Blueprint is created: paste a new Ed25519 key
      # (command in apps/api/src/lib/recordSigning.ts).
      - key: ACEV_PRIVATE_KEY
        sync: false
      - key: MOCK_PAYMENTS_CONFIRM_MS
        value: "4000"
