# Runs every automated test on a clean Linux machine with a real PostgreSQL
# database, on each push and pull request to main. The values below are
# test-only: they protect nothing real.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: novi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the shared package
        run: npm run build:shared

      - name: Generate the database client
        working-directory: apps/api
        run: npx prisma generate

      - name: Test settings (test-only values)
        working-directory: apps/api
        run: |
          cat > .env.test <<'ENV'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/novi_test
          JWT_SECRET=ci-test-jwt-secret-at-least-32-characters
          NIU_HASH_KEY=ci-test-niu-hash-key-at-least-32-chars
          ENV

      # The coverage tool is installed for this run only (--no-save), so the
      # project's package files stay as they are.
      - name: Install the coverage tool
        run: npm install --no-save @vitest/coverage-v8@5.0.5

      - name: API tests (unit and integration), with code coverage
        working-directory: apps/api
        run: >-
          npx vitest run --coverage
          --coverage.provider=v8
          --coverage.include='src/**'
          --coverage.exclude='src/generated/**'
          --coverage.exclude='src/test/**'
          --coverage.exclude='src/scripts/**'
          --coverage.reporter=text
          --coverage.reporter=text-summary

      - name: Member app tests
        working-directory: apps/mobile
        run: npx vitest run src/lib
