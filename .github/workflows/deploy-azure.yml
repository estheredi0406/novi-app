# Builds the server image on every push to main, stores it in GitHub's
# container registry (GHCR), then tells Azure App Service to run it (D59).
# Secrets live in GitHub and Azure, never in the repository.
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch: # also runnable by hand from the Actions tab

permissions:
  contents: read
  packages: write # to push the image to GHCR

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/novi-api
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub's container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Point the Azure web app at this image
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE }}:${{ github.sha }}